  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/katana.rsi
    layers:
    - state: icon
  - type: Item
    size: Huge
    shape:
    - 0,0,1,3
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/katana_storage_64x.rsi
  - type: Clothing
    sprite: Objects/Weapons/Melee/katana.rsi
    quickEquip: true
    slots:
    - Belt
    - Back
    - SuitStorage
  - type: Wieldable
  - type: MeleeWeapon
    attackRate: 1.3
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 26
        Piercing: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Reflect
    reflects:
    - NonEnergy
    - Energy
    reflectProb: 0.25
    spread: 60
  - type: Sharp
  - type: DisarmMalus
    malus: 0.6
  - type: Katana
  - type: StaticPrice
    price: 2500
