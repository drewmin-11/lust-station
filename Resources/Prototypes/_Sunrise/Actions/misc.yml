- type: entity
  parent: BaseAction
  id: GoliathHoodToggleAction
  name: Switching hood
  description: Switching hood
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    icon: { sprite: _Sunrise/Clothing/Neck/Mantles/goliathalivemantle.rsi, state: icon }
  - type: InstantAction
    event: !type:ToggleClothingEvent

- type: entity
  parent: BaseAction
  id: ActionBlowSmokeRing
  name: action-blow-smoke-ring
  description: action-blow-smoke-ring-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1.5
    icon: { sprite: _Sunrise/Effects/smoke_ring.rsi, state: ring }
  - type: TargetAction
    range: 20
  - type: WorldTargetAction
    event: !type:BlowSmokeRingActionEvent

