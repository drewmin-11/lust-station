- type: entity
  parent: [BaseItem, SolutionSmokable, SolutionTiny]
  id: VapeCartridge
  name: vape cartridge
  description: A 15u refillable pod cartridge for electronic vaporizers. Can be refilled with any vape e-liquid.
  components:
  - type: Tag
    tags:
    - VapeCartridge
  - type: VapeCartridge
  - type: Item
    size: Tiny
  - type: RefillableSolution
    solution: smokable
  - type: DrainableSolution
    solution: smokable
  - type: ExaminableSolution
    solution: smokable
  - type: SolutionTransfer
    maxTransferAmount: 15
    transferAmount: 5
    canChangeTransferAmount: true
  - type: Sprite
    sprite: _Sunrise/Objects/Consumable/Smokeables/Vapes/cartridge.rsi
    scale: "0.6, 0.6"
    layers:
    - state: cartridge-empty
      map: ["base"]
  - type: Solution
    id: smokable
    solution:
      maxVol: 15
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SmokingVisuals.CartridgeState:
        base:
          empty: { state: cartridge-empty }
          icon: { state: cartridge-empty }
          vape-mint: { state: cartridge-mint }
          vape-berry: { state: cartridge-berry }
          vape-tobacco: { state: cartridge-tobacco }
          vape-banana: { state: cartridge-banana }

# Флаконы с жидкостью для заправки вейпа (30u)
- type: entity
  parent: [BaseItem, SolutionDrink, SolutionSmall]
  id: BaseVapeJuice
  abstract: true
  components:
  - type: Item
    size: Small
  - type: RefillableSolution
    solution: drink
  - type: DrainableSolution
    solution: drink
  - type: ExaminableSolution
    solution: drink
  - type: SolutionTransfer
    maxTransferAmount: 15
    transferAmount: 5
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Sprite
    sprite: _Sunrise/Objects/Consumable/Smokeables/Vapes/vape_juice.rsi
    scale: "0.6, 0.6"

- type: entity
  parent: BaseVapeJuice
  id: VapeJuiceMint
  name: mint e-liquid bottle
  description: A 30ml bottle of cool mint and lime e-liquid with nicotine for refilling vape pods.
  components:
  - type: Sprite
    state: bottle-mint
  - type: Solution
    id: drink
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Water
        Quantity: 18
      - ReagentId: Nicotine
        Quantity: 8
      - ReagentId: JuiceLime
        Quantity: 4

- type: entity
  parent: BaseVapeJuice
  id: VapeJuiceBerry
  name: berry e-liquid bottle
  description: A 30ml bottle of sweet berry mix e-liquid with nicotine for refilling vape pods.
  components:
  - type: Sprite
    state: bottle-berry
  - type: Solution
    id: drink
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Water
        Quantity: 18
      - ReagentId: Nicotine
        Quantity: 8
      - ReagentId: JuiceBerry
        Quantity: 4

- type: entity
  parent: BaseVapeJuice
  id: VapeJuiceTobacco
  name: tobacco e-liquid bottle
  description: A 30ml bottle of classic aromatic tobacco e-liquid with high nicotine content for refilling vape pods.
  components:
  - type: Sprite
    state: bottle-tobacco
  - type: Solution
    id: drink
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Water
        Quantity: 18
      - ReagentId: Nicotine
        Quantity: 10
      - ReagentId: Coffee
        Quantity: 2

- type: entity
  parent: BaseVapeJuice
  id: VapeJuiceBanana
  name: zapravka banana bubblegum e-liquid bottle
  description: A 30ml bottle of sweet banana and bubblegum e-liquid with nicotine for refilling vape pods.
  components:
  - type: Sprite
    state: bottle-banana
  - type: Solution
    id: drink
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Water
        Quantity: 18
      - ReagentId: Nicotine
        Quantity: 8
      - ReagentId: JuiceBanana
        Quantity: 4

# Никотиновый пластырь
- type: entity
  parent: BaseItem
  id: NicotinePatch
  name: nicotine transdermal patch
  description: A medicated adhesive patch that slowly delivers nicotine into the bloodstream through the skin, relieving withdrawal cravings for 5 minutes.
  components:
  - type: NicotinePatchItem
    useTime: 1.5
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Sunrise/Objects/Specific/Medical/nicotine_patch.rsi
    state: pack

# Никотиновая жвачка
- type: entity
  parent: FoodBase
  id: FoodNicotineGum
  name: nicotine chewing gum
  description: Medicated minty chewing gum infused with nicotine to instantly satisfy smoke cravings anywhere.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Sunrise/Objects/Consumable/Smokeables/nicotine_gum.rsi
    state: pack
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nicotine
          Quantity: 3
        - ReagentId: Sugar
          Quantity: 2
        - ReagentId: JuiceLime
          Quantity: 1

# Визуальный эффект летящего колечка дыма/пара
- type: entity
  id: EffectSmokeRing
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.9
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: _Sunrise/Effects/smoke_ring.rsi
    state: ring
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0.1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - FullTileMask
        - TableMask
        - MobMask
        layer:
        - SlipLayer
  - type: SmokeRing
  - type: Appearance
  - type: SmokeVisuals
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer


