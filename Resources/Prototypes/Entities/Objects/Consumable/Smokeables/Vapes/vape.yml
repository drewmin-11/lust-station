- type: entity
  id: Vape
  parent: BaseVape
  name: electronic pod-mod vape
  description: A sleek electronic pod-mod vaporizer. Requires an inserted pod cartridge to use.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Consumable/Smokeables/Vapes/vape.rsi
    layers:
    - state: icon
      map: ["enum.VapeVisualLayers.Base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.VapeVisuals.HasCartridge:
        enum.VapeVisualLayers.Base:
          True: { state: icon }
          False: { state: empty }
  - type: ItemSlots
    slots:
      cartridge:
        name: vape-slot-cartridge
        whitelist:
          components:
          - VapeCartridge
        insertVerbText: vape-cartridge-insert-verb
        ejectVerbText: vape-cartridge-eject-verb
  - type: ContainerContainer
    containers:
      cartridge: !type:ContainerSlot
