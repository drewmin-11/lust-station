- type: entity
  id: Vape
  parent: BaseVape
  name: electronic pod-mod vape
  description: A sleek electronic pod-mod vaporizer. Requires an inserted pod cartridge to use.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Consumable/Smokeables/Vapes/vape.rsi
    layers:
    - state: icon
      map: ["base"]
  # Sunrise edit start - слот картриджа и смена спрайта
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SmokingVisuals.CartridgeState:
        base:
          empty: { state: empty }
          icon: { state: icon }
          vape-mint: { state: vape-mint }
          vape-berry: { state: vape-berry }
          vape-tobacco: { state: vape-tobacco }
          vape-banana: { state: vape-banana }
  - type: ItemSlots
    slots:
      cartridge:
        name: Cartridge
        whitelist:
          tags:
          - VapeCartridge
        insertVerbText: vape-cartridge-insert-verb
        ejectVerbText: vape-cartridge-eject-verb
  - type: ContainerContainer
    containers:
      cartridge: !type:ContainerSlot
  # Sunrise edit end
